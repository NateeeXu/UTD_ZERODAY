<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triage Loop · map style preview (A + C + D)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --ink:#1d1d1f; --muted:#6b6b70; --line:#e3e3e8; --bg:#f6f6f7; --p0:#d93a35; --p1:#ee7d2b; --p2:#e8b931; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; color:var(--ink); background:var(--bg); display:flex; flex-direction:column; height:100vh; }
  header { display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:10px 16px; background:#fff; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .sub { color:var(--muted); font-size:13px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button { border:0; background:#fff; padding:6px 11px; font:inherit; font-size:13px; cursor:pointer; color:var(--muted); }
  .seg button.on { background:var(--ink); color:#fff; }
  .spacer { flex:1; }
  label.chk { display:flex; align-items:center; gap:6px; color:var(--muted); cursor:pointer; font-size:13px; }
  .grid { flex:1; display:grid; gap:1px; background:var(--line); min-height:480px; }
  .grid.single { grid-template-columns:1fr; }
  .grid.split { grid-template-columns:1fr 1fr; }
  .grid.single .panel.hidden { display:none; }
  .panel { display:flex; flex-direction:column; background:#fff; min-width:0; min-height:0; }
  .meta { padding:9px 16px; border-bottom:1px solid var(--line); }
  .meta .t { font-size:15px; font-weight:600; }
  .meta .t .res { font-size:12px; font-weight:500; color:var(--muted); margin-left:8px; padding:1px 7px; border:1px solid var(--line); border-radius:999px; }
  .meta .s { color:var(--muted); font-size:13px; }
  .meta .stats { margin-top:3px; font-size:13px; }
  .meta .stats b { font-weight:600; }
  .map { flex:1; min-height:0; }
  footer { display:flex; gap:20px; align-items:center; flex-wrap:wrap; padding:8px 16px; background:#fff; border-top:1px solid var(--line); font-size:12.5px; color:var(--muted); }
  .sw { display:inline-block; width:14px; height:12px; border-radius:2px; vertical-align:-1px; margin-right:5px; }
  .ramp { display:inline-flex; gap:2px; vertical-align:-1px; margin-right:5px; }
  .ramp i { width:12px; height:12px; border-radius:2px; background:var(--p0); }
  .leaflet-tooltip.tip { max-width:330px; white-space:normal; font-size:12.5px; line-height:1.4; }
  .pulse-ring { transform-box: fill-box; transform-origin: center; animation: ring 1.8s ease-out infinite; }
  @keyframes ring { 0% { transform: scale(1); stroke-opacity: .95; } 75% { transform: scale(1.6); stroke-opacity: 0; } 100% { transform: scale(1.6); stroke-opacity: 0; } }
  .qmark { width:16px; height:16px; border-radius:50%; background:#fff; border:1.5px solid currentColor; display:flex; align-items:center; justify-content:center; font:600 11px/1 -apple-system,BlinkMacSystemFont,sans-serif; pointer-events:none; }
  @media (max-width: 900px) { .grid.split { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>Triage Loop</h1>
  <span class="sub">Synthetic exercise · real geography and census data · no real customer data</span>
  <span class="spacer"></span>
  <div class="seg" id="views"></div>
  <div class="seg" id="times"></div>
  <label class="chk"><input type="checkbox" id="qmarks" checked> D: ?</label>
  <label class="chk"><input type="checkbox" id="schools"> Schools and hospitals</label>
</header>
<div class="grid single" id="grid">
  <section class="panel" id="panel-tx"><div class="meta" id="meta-tx"></div><div class="map" id="map-tx"></div></section>
  <section class="panel" id="panel-ca"><div class="meta" id="meta-ca"></div><div class="map" id="map-ca"></div></section>
</div>
<footer>
  <span><span class="sw" style="background:var(--p0)"></span>P0 act now</span>
  <span><span class="sw" style="background:var(--p1)"></span>P1</span>
  <span><span class="sw" style="background:var(--p2)"></span>P2</span>
  <span><span class="ramp"><i style="opacity:.2"></i><i style="opacity:.5"></i><i style="opacity:.85"></i></span>Fainter = less confident</span>
  <span><svg width="18" height="14" style="vertical-align:-2px;margin-right:4px"><polygon points="9,1 16,5 16,11 9,13 2,11 2,5" fill="none" stroke="#d93a35" stroke-width="2"/></svg>Pulsing = top 10 silent high-hazard areas</span>
  <span><span class="qmark" style="display:inline-flex;color:#7a1714;vertical-align:-3px;margin-right:4px">?</span>Needs verification</span>
  <span>Zoomed out: districts (H3 res 7, ~5 km²) · zoom in for neighborhoods (res 8, ~0.7 km²)</span>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"></script>
<script src="preview-data.js"></script>
<script>
const D = window.PREVIEW_DATA;
const COLOR = { P0: '#d93a35', P1: '#ee7d2b', P2: '#e8b931' };
const DARK = { P0: '#7a1714', P1: '#7a3a0c', P2: '#6b5208' };
const RANK = { P0: 0, P1: 1, P2: 2 };
const CAUSE = { outage: 'cell towers down', away: 'residents likely away at work', trapped: 'many vulnerable residents', unknown: 'cause unclear' };
const PULSE_TOP = 10, Q_TOP = 25, LOD_ZOOM = 12, Q_ALL_ZOOM = 13;
const REGIONS = ['tx', 'ca'];
let current = D.times[1];
let view = 'tx';
const state = {};

const fmtTime = (t) => (t < 60 ? t + ' min' : t / 60 + ' h');
const isSuspected = (c) => c.p === 'P0' && c.v === 'needs_verification' && c.si >= 0.5 && c.hz >= 0.5;
function localTime(r) {
  if (r.eventLocalHour == null) return '';
  return ` · event at ${String(r.eventLocalHour).padStart(2, '0')}:00 local, ${r.eventWeekday ? 'weekday' : 'weekend'}`;
}

/* Display units: res-8 cells as-is, or res-7 districts aggregated from their res-8 children. */
function unitsFor(snap, res) {
  if (res === 8) {
    return snap.map((c) => ({ ...c, id: c.hex, shape: h3.cellToBoundary(c.hex), center: h3.cellToLatLng(c.hex), kids: [c] }));
  }
  const groups = new Map();
  for (const c of snap) {
    const p = h3.cellToParent(c.hex, 7);
    if (!groups.has(p)) groups.set(p, []);
    groups.get(p).push(c);
  }
  const units = [];
  for (const [id, kids] of groups) {
    const n = kids.reduce((s, k) => s + k.n, 0);
    const w = (k) => (n > 0 ? k.n / n : 1 / kids.length);
    const top = kids.reduce((a, b) => (RANK[b.p] < RANK[a.p] || (RANK[b.p] === RANK[a.p] && b.s > a.s) ? b : a));
    const needs = kids.some((k) => k.v === 'needs_verification' && k.p === top.p);
    const silentKid = kids.reduce((a, b) => (b.si * b.hz > a.si * a.hz ? b : a));
    units.push({
      id, kids, n,
      p: top.p,
      v: needs ? 'needs_verification' : 'verified',
      c: kids.reduce((s, k) => s + w(k) * k.c, 0),
      si: silentKid.si, hz: silentKid.hz, sc: silentKid.sc,
      ex: Math.round(kids.reduce((s, k) => s + k.ex, 0) * 10) / 10,
      rep: kids.reduce((s, k) => s + k.rep, 0), sent: kids.reduce((s, k) => s + k.sent, 0), cl: kids.reduce((s, k) => s + k.cl, 0),
      r: top.r,
      shape: h3.cellsToMultiPolygon(kids.map((k) => k.hex)),
      center: [kids.reduce((s, k) => s + h3.cellToLatLng(k.hex)[0], 0) / kids.length, kids.reduce((s, k) => s + h3.cellToLatLng(k.hex)[1], 0) / kids.length],
    });
  }
  return units;
}

function setup(id) {
  const r = D.regions[id];
  const map = L.map('map-' + id, { zoomControl: true });
  const base = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, OpenStreetMap contributors', maxZoom: 16,
  }).addTo(map);
  map.createPane('labels');
  map.getPane('labels').style.zIndex = 450;
  map.getPane('labels').style.pointerEvents = 'none';
  const labels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 16, pane: 'labels',
  }).addTo(map);
  const layers = { cells: L.layerGroup().addTo(map), rings: L.layerGroup().addTo(map), qmarks: L.layerGroup().addTo(map), fac: L.layerGroup() };
  for (const f of r.facilities) {
    const school = f.k !== 'hospital';
    L.circleMarker([f.lat, f.lng], { radius: f.k === 'university' ? 5 : 3, color: school ? '#2b5fb4' : '#0f7a55', weight: 1.5, fillColor: '#fff', fillOpacity: 1 })
      .bindTooltip(`${f.n}${f.e ? ` · ${f.e.toLocaleString()} students` : ''}`, { direction: 'top' }).addTo(layers.fac);
  }
  const all = r.snapshots[String(D.times[0])];
  state[id] = { map, layers, tiles: [base, labels], bounds: L.latLngBounds(all.flatMap((c) => h3.cellToBoundary(c.hex))), res: null };
  map.fitBounds(state[id].bounds, { padding: [12, 12] });
  map.on('zoomend', () => render(id));
}

function render(id) {
  const st = state[id];
  if (!st) return;
  const r = D.regions[id];
  const snap = r.snapshots[String(current)];
  const zoom = st.map.getZoom();
  const res = zoom < LOD_ZOOM ? 7 : 8;
  st.res = res;
  const { cells, rings, qmarks } = st.layers;
  cells.clearLayers(); rings.clearLayers(); qmarks.clearLayers();

  const topKids = new Set(snap.filter(isSuspected).sort((a, b) => b.si * b.hz * b.n - a.si * a.hz * a.n).slice(0, PULSE_TOP).map((c) => c.hex));
  const units = unitsFor(snap, res);
  const pulsing = new Set(units.filter((u) => u.kids.some((k) => topKids.has(k.hex))).map((u) => u.id));

  for (const u of units) {
    const color = COLOR[u.p];
    const poly = L.polygon(u.shape, { color, weight: res === 7 ? 1 : 0.6, opacity: 0.35 + 0.5 * u.c, fillColor: color, fillOpacity: 0.12 + 0.73 * u.c });
    const cause = u.sc && u.si >= 0.2 ? `<br>Silence: ${Math.round(u.si * 100)}% · ${CAUSE[u.sc] || u.sc}` : '';
    const scope = res === 7 ? `District of ${u.kids.length} neighborhoods · ` : '';
    poly.bindTooltip(
      `<b>${u.p}${u.v === 'needs_verification' ? ' · needs verification' : ' · verified'}</b>` +
      `<br>${scope}Confidence ${Math.round(u.c * 100)}% · ${u.n.toLocaleString()} households · ~${u.ex} likely severe` +
      `<br>SMS replies ${u.rep}/${u.sent} · claims ${u.cl}${cause}` +
      (u.r ? `<br><span style="color:#6b6b70">${u.r}</span>` : ''),
      { sticky: true, className: 'tip' });
    poly.addTo(cells);
    if (pulsing.has(u.id)) {
      L.polygon(u.shape, { color: '#d93a35', weight: 2.5, fill: false, interactive: false, className: 'pulse-ring' }).addTo(rings);
      L.polygon(u.shape, { color: '#7a1714', weight: 1.6, fill: false, interactive: false }).addTo(rings);
    }
  }

  if (document.getElementById('qmarks').checked) {
    let todo = units.filter((u) => u.v === 'needs_verification' && !pulsing.has(u.id));
    if (zoom < Q_ALL_ZOOM) todo = todo.filter((u) => u.p === 'P0').sort((a, b) => b.n * (1 - b.c) - a.n * (1 - a.c)).slice(0, Q_TOP);
    for (const u of todo) {
      L.marker(u.center, { interactive: false, keyboard: false, icon: L.divIcon({ className: '', iconSize: [16, 16], html: `<div class="qmark" style="color:${DARK[u.p]}">?</div>` }) }).addTo(qmarks);
    }
  }

  const counts = { P0: 0, P1: 0, P2: 0 }; let nv = 0;
  for (const c of snap) { counts[c.p]++; if (c.v === 'needs_verification') nv++; }
  document.getElementById('meta-' + id).innerHTML =
    `<div class="t">${r.title}<span class="res">${res === 7 ? 'districts · res 7' : 'neighborhoods · res 8'}</span></div>` +
    `<div class="s">${r.subtitle}${localTime(r)}</div>` +
    `<div class="stats">${r.households.toLocaleString()} synthetic policyholders · ${r.cells} neighborhoods · t = ${fmtTime(current)} · ` +
    `<b style="color:${COLOR.P0}">${counts.P0} P0</b> · ${counts.P1} P1 · ${counts.P2} P2 · <b>${nv}</b> need verification</div>`;
}

function applyView() {
  const grid = document.getElementById('grid');
  grid.className = 'grid ' + (view === 'split' ? 'split' : 'single');
  for (const id of REGIONS) document.getElementById('panel-' + id).classList.toggle('hidden', view !== 'split' && view !== id);
  setTimeout(() => {
    for (const id of REGIONS) {
      if (view !== 'split' && view !== id) continue;
      state[id].map.invalidateSize();
      state[id].map.fitBounds(state[id].bounds, { padding: [12, 12], animate: false });
      state[id].tiles.forEach((t) => t.redraw());
      render(id);
    }
  }, 0);
}

function segment(el, items, isOn, onPick) {
  for (const [value, label] of items) {
    const b = document.createElement('button');
    b.textContent = label;
    if (isOn(value)) b.classList.add('on');
    b.onclick = () => { [...el.children].forEach((x) => x.classList.toggle('on', x === b)); onPick(value); };
    el.appendChild(b);
  }
}
segment(document.getElementById('views'), [['tx', 'Corpus Christi'], ['ca', 'Bay Area'], ['split', 'Side by side']], (v) => v === view, (v) => { view = v; applyView(); });
segment(document.getElementById('times'), D.times.map((t) => [t, 't = ' + fmtTime(t)]), (t) => t === current, (t) => { current = t; REGIONS.forEach(render); });
document.getElementById('qmarks').onchange = () => REGIONS.forEach(render);
document.getElementById('schools').onchange = (e) => { for (const id of REGIONS) e.target.checked ? state[id].layers.fac.addTo(state[id].map) : state[id].layers.fac.remove(); };

setup('tx'); setup('ca'); applyView();
</script>
</body>
</html>
